<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | FlowReach</title>
    <link rel="stylesheet" href="Style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .contact-hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, rgba(163, 18, 63, 0.05) 0%, rgba(232, 87, 125, 0.05) 100%);
        }

        .contact-hero h1 {
            font-family: var(--font-display);
            font-size: 48px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 12px;
        }

        .contact-hero .highlight {
            color: var(--rose);
        }

        .contact-hero p {
            font-size: 16px;
            color: var(--ink-soft);
            max-width: 600px;
            margin: 0 auto;
        }

        .contact-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .contact-form-wrapper {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .contact-form-wrapper h2 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-size: 20px;
            color: var(--ink);
            margin-bottom: 28px;
        }

        .contact-form-wrapper h2::before {
            content: '✉';
            font-size: 24px;
            color: var(--berry);
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .form-group label .required {
            color: var(--rose);
        }

        .form-group input,
        .form-group textarea {
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--ink);
            background: var(--paper);
            transition: border-color 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--berry);
            background: #fff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            font-family: var(--font-body);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--berry);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: #8b0f36;
        }

        .submit-btn::before {
            content: '→';
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .info-item {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 16px;
        }

        .info-item-icon {
            width: 44px;
            height: 44px;
            background: rgba(163, 18, 63, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            color: var(--berry);
        }

        .info-item-content h3 {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .info-item-content p {
            font-size: 14px;
            color: var(--ink-soft);
            line-height: 1.5;
        }

        .info-item-content a {
            color: var(--berry);
            text-decoration: none;
            font-weight: 600;
        }

        .info-item-content a:hover {
            text-decoration: underline;
        }

        @media (max-width: 860px) {
            .contact-hero h1 {
                font-size: 36px;
            }

            .contact-container {
                grid-template-columns: 1fr;
                gap: 28px;
                margin: 40px auto;
            }

            .contact-form-wrapper {
                padding: 28px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="logo-wrapper">
            <a href="Home.html" class="logo">🩸 <span>FlowReach</span></a>
            <span class="logo-tagline">data-driven</span>
        </div>
        <ul>
            <li><a href="Home.html">Home</a></li>
            <li><a href="About.html">About</a></li>
            <li><a href="Dashboard.html">Dashboard</a></li>
            <li><a href="Contact.html" class="active">Contact</a></li>
        </ul>
        <a href="Login.html" class="btn-sign-in">👤 Sign in</a>
    </nav>

    <!-- Hero Section -->
    <section class="contact-hero">
        <h1>Get in <span class="highlight">touch</span></h1>
        <p>Have questions or want to partner with us? Reach out — we'd love to hear from you.</p>
    </section>

    <!-- Contact Section -->
    <section class="contact-container">
        <!-- Contact Form -->
        <div class="contact-form-wrapper">
            <h2>Send a Message</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input type="text" id="fullName" name="fullName" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message <span class="required">*</span></label>
                    <textarea id="message" name="message" placeholder="How can we help?" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>

        <!-- Contact Information -->
        <div class="contact-info">
            <div class="info-item">
                <div class="info-item-icon">📧</div>
                <div class="info-item-content">
                    <h3>Email</h3>
                    <p><a href="mailto:hello@flowreach.org">hello@flowreach.org</a></p>
                </div>
            </div>

            <div class="info-item">
                <div class="info-item-icon">📞</div>
                <div class="info-item-content">
                    <h3>Phone</h3>
                    <p><a href="tel:+27215550199">+27 (0) 21 555 0199</a></p>
                </div>
            </div>

            <div class="info-item">
                <div class="info-item-icon">📍</div>
                <div class="info-item-content">
                    <h3>Location</h3>
                    <p>Cape Town, South Africa</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Set active nav link
        document.querySelectorAll('.nav a').forEach(link => {
            if (link.href.includes(window.location.pathname.split('/').pop())) {
                link.classList.add('active');
            }
        });

        // Handle form submission
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            // Simple validation
            if (fullName && email && message) {
                alert(`Thank you for your message, ${fullName}! We'll get back to you at ${email} soon.`);
                this.reset();
            }
        });
    </script>
</body>
</html>
